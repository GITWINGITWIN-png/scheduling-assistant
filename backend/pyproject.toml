[project]
name = "my-secretary"
version = "2.0.0.dev0"
description = "Personal secretary v2: reads mail, plans the schedule, runs background work, reports on Discord and a web dashboard"
requires-python = ">=3.12"
# Dependencies are added with `uv add` in the step that first needs them,
# so each commit shows what it brought in (see docs/plan-v2/PLAN.md, B1).
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.11,<4",
    "claude-agent-sdk>=0.2.178",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

# Run from backend/:  uv run uvicorn app.main:app --reload --port 8000
